<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Shantanu Soni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">SS</span>
        <span class="brand-copy"><strong>Shantanu Soni</strong><small>Portfolio</small></span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle>Menu</button>
      <nav class="site-nav" data-nav>
        <a href="/">Home</a>
        <a href="/experience">Experience</a>
        <a href="/projects">Projects</a>
        <a href="/skills">Skills</a>
        <a href="/education">Education</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Hiring & collaborations</span>
      <h1>Contact</h1>
      <p>Recruiters and hiring managers can send a note here. The payload is validated against a tight Pydantic schema before it is stored.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <form class="form" data-contact-form>
        <label>
          Name
          <input type="text" name="name" minlength="2" maxlength="120" required />
        </label>
        <label>
          Work email
          <input type="email" name="email" required />
        </label>
        <label>
          Company
          <input type="text" name="company" maxlength="160" />
        </label>
        <label>
          Inquiry type
          <select name="inquiry_type" id="inquiryType" required></select>
        </label>
        <label>
          Message
          <textarea name="message" minlength="20" maxlength="3000" required placeholder="Role, team, location, and anything useful about the brief."></textarea>
        </label>
        <button class="btn btn-primary" type="submit">Send message</button>
        <p class="form-status" data-form-status></p>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Shantanu Soni · Epsom, UK</span>
      <a href="mailto:shantanusoniuv@gmail.com">shantanusoniuv@gmail.com</a>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/contact.js"></script>
</body>
</html>
