<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shantanu Soni — Data Scientist & AI Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark">SS</span>
        <span class="brand-copy"><strong>Shantanu Soni</strong><small>Portfolio</small></span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle>Menu</button>
      <nav class="site-nav" data-nav>
        <a href="/">Home</a>
        <a href="/experience">Experience</a>
        <a href="/projects">Projects</a>
        <a href="/skills">Skills</a>
        <a href="/education">Education</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-grid">
      <div data-hero>
        <p class="loading">Loading profile…</p>
      </div>
      <div class="portrait-wrap">
        <div class="portrait">
          <img data-photo src="/static/assets/headshot.jpg" alt="Shantanu Soni" />
        </div>
      </div>
    </div>
  </section>

  <div class="container">
    <div class="stats" data-stats></div>
  </div>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Stack</span>
          <h2 class="section-title">Featured skills</h2>
        </div>
        <a class="btn btn-ghost" href="/skills">All skills</a>
      </div>
      <div class="chip-row" data-featured-skills></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Career</span>
          <h2 class="section-title">Recent experience</h2>
        </div>
        <a class="btn btn-ghost" href="/experience">Full timeline</a>
      </div>
      <div class="timeline" data-latest-experience></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Selected work</span>
          <h2 class="section-title">Featured projects</h2>
        </div>
        <a class="btn btn-ghost" href="/projects">All projects</a>
      </div>
      <div class="grid-2" data-featured-projects></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Shantanu Soni · Epsom, UK</span>
      <a href="mailto:shantanusoniuv@gmail.com">shantanusoniuv@gmail.com</a>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/home.js"></script>
</body>
</html>
